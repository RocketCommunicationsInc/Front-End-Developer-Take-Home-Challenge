<main>
  <section matSort (matSortChange)="sortAlerts($event)">
    <div class="sorting">
      <th mat-sort-header="contactName">Name</th>
      <th mat-sort-header="errorTime">Error Time</th>
      <th mat-sort-header="errorSeverity">Error Severity</th>
    </div>
    <article class="alerts-container">
      <div *ngFor="let alert of sortedAlerts; index as i">
        <app-alert-card [alert]="alert" [index]="i" (showDetails)="handleShowDetails($event)" />
      </div>
    </article>
  </section>
  <app-contact-details
    [open]="showContactDetails"
    [alert]="sortedAlerts[focusedAlertIndex]"
    (acknowledgeAlert)="handleAck()"
  >
  </app-contact-details>
</main>
