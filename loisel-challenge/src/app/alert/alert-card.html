<rux-card [attr.acknowledged]="alert().acknowledged" [attr.severity]="alert().errorSeverity">
  <div slot="header">
    <rux-icon [icon]="alert().acknowledged ? 'check-circle-outline' : 'warning'" />
    {{ alert().contactName }}
    <rux-button (click)="handleAlertClick()"> Show Details </rux-button>
  </div>
  {{ alert().errorMessage }}
  <p>{{ alert().contactBeginTimestamp }}</p>
  <p>{{ alert().contactEndTimestamp }}</p>
</rux-card>
