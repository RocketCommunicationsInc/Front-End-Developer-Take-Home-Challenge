<rux-card [attr.acknowledged]="alert().acknowledged">
  <section slot="header">
    <rux-icon
      [icon]="alert().acknowledged ? 'check-circle-outline' : 'warning'"
      [attr.severity]="alert().errorSeverity"
      size="small"
    />
    <span class="title"> {{ alert().contactName }} - {{ alert().errorSeverity }} </span>
    <rux-button (click)="handleAlertClick()" [secondary]="alert().acknowledged"> Show Details </rux-button>
  </section>
  <section class="card-body">
    <span>{{ alert().errorMessage }} </span>
    <span>{{ alert().contactBeginTimestamp }} - {{ alert().contactEndTimestamp }}</span>
  </section>
</rux-card>
