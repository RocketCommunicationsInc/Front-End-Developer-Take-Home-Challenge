<!-- TODO(gabriel): Figure out how to access component properties for
      app-domain, app-name, etc. attributes. -->
<rux-global-status-bar
  app-domain="GRM"
  app-name="Dashboard"
  app-version="1.0 Alpha"
  app-state="Dev"
  username="G. Perry"
>
  <rux-clock timezone="America/Denver"></rux-clock>
</rux-global-status-bar>

<div class="button-group">
  <rux-button class="data-button" size="large" secondary=""
    (click)="clearData()">Clear Data</rux-button>
  <rux-button class="data-button" size="large"
    (click)="loadData()">Load Data</rux-button>
</div>

<div id="contact-table">
  <rux-table>
    <rux-table-header>
      <rux-table-header-row>
        <rux-table-header-cell>Status</rux-table-header-cell>
        <rux-table-header-cell>Name</rux-table-header-cell>
        <rux-table-header-cell>IRON</rux-table-header-cell>
        <rux-table-header-cell>Ground Station</rux-table-header-cell>
        <rux-table-header-cell>State</rux-table-header-cell>
      </rux-table-header-row>
    </rux-table-header>
    <rux-table-body>
      <rux-table-row *ngFor="let row of rows">
        <rux-table-cell>{{ row.status }}</rux-table-cell>
        <rux-table-cell>{{ row.name }}</rux-table-cell>
        <rux-table-cell>{{ row.iron }}</rux-table-cell>
        <rux-table-cell>{{ row.groundStation }}</rux-table-cell>
        <rux-table-cell>{{ row.state }}</rux-table-cell>
      </rux-table-row>
    </rux-table-body>
  </rux-table>
</div>
